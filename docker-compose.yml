# Optional Postgres 16. Alternative to `npm run db`, not something to run beside it.
# Both listen on 5432. Point DATABASE_URL at:
# postgresql://taska:taska@localhost:5432/taska?schema=public
# Then run `npx prisma migrate deploy` and `npm run db:seed`.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: taska
      POSTGRES_PASSWORD: taska
      POSTGRES_DB: taska
    ports:
      - "5432:5432"
    volumes:
      - taska-pg:/var/lib/postgresql/data

volumes:
  taska-pg:
